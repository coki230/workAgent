<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历管家 - Resume Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center;
            background: #f1f5f9;
            color: #64748b;
            font-size: 13px;
            max-width: 90%;
            text-align: center;
        }
        .input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 16px 20px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        #message-input {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: none;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        #message-input:focus { border-color: #2563eb; }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background: #cbd5e1; }
        .file-name {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }
        .typing {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 10px 16px;
            border-radius: 12px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>简历管家</h1>
        <div>
            <span id="status-text" style="font-size:13px;margin-right:12px;opacity:0.8;">已登录</span>
            <button onclick="logout()">退出</button>
        </div>
    </div>

    <div class="chat-container" id="chat-container">
        <!-- 消息会动态插入这里 -->
    </div>

    <div class="input-area">
        <div class="input-row">
            <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="handleFileSelect(this)">
            <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">上传文件</button>
            <textarea id="message-input" placeholder="输入消息，或直接粘贴岗位JD让我生成简历...&#10;也可以说「保存这段经历」「我的GitHub是xxx」等" rows="1"></textarea>
            <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">发送</button>
        </div>
        <div class="file-name" id="file-name"></div>
    </div>

    <script>
        let selectedFile = null;

        function getToken() {
            return localStorage.getItem("token");
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        function checkAuth() {
            if (!getToken()) {
                window.location.href = "/login";
                return false;
            }
            return true;
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = { ...(options.headers || {}), "Authorization": `Bearer ${token}` };
            if (!(options.body instanceof FormData)) {
                headers["Content-Type"] = headers["Content-Type"] || "application/json";
            }
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                logout();
                throw new Error("登录已过期");
            }
            return res;
        }

        function addMessage(content, role = "bot") {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${role}`;
            div.textContent = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addTyping() {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = "typing";
            div.id = "typing-indicator";
            div.textContent = "管家正在思考...";
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById("file-name").textContent = "已选择：" + selectedFile.name;
            }
        }

        // 发送消息（核心逻辑）
        async function sendMessage() {
            if (!checkAuth()) return;

            const input = document.getElementById("message-input");
            const text = input.value.trim();
            const btn = document.getElementById("send-btn");

            if (!text && !selectedFile) return;

            // 显示用户消息
            if (selectedFile) {
                addMessage(`[上传文件] ${selectedFile.name}` + (text ? "\n" + text : ""), "user");
            } else {
                addMessage(text, "user");
            }

            input.value = "";
            btn.disabled = true;
            addTyping();

            try {
                // 情况1：有文件 → 优先上传
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append("file", selectedFile);
                    if (text) formData.append("note", text);  // 可选备注

                    const res = await apiFetch("/api/v1/resumes/upload", {
                        method: "POST",
                        body: formData
                    });
                    const data = await res.json();

                    removeTyping();
                    if (res.ok) {
                        addMessage("已收到并解析你的简历，内容已保存。\n你可以继续补充项目经历、GitHub，或者直接发岗位JD让我生成定制简历。", "bot");
                    } else {
                        addMessage("上传失败：" + (data.detail || "未知错误"), "bot");
                    }
                    selectedFile = null;
                    document.getElementById("file-name").textContent = "";
                    document.getElementById("file-input").value = "";
                }
                // 情况2：纯文字
                else {
                    // 判断是否像「生成简历」请求
                    const isGenerate = /生成|写一份|做一份|根据.*岗位|针对.*职位|JD|职位要求/i.test(text) && text.length > 30;

                    if (isGenerate) {
                        // 简单提取风格描述（可继续优化）
                        let styleDescription = null;
                        const styleMatch = text.match(/(用|按照|做成|生成)(.*?)(风格|模板|样式)/i);
                        if (styleMatch) {
                            styleDescription = styleMatch[2].trim() + "风格";
                        } else if (/极简|简约|商务|双栏|现代|创意|彩色|黑白/.test(text)) {
                            styleDescription = text;  // 直接把整句当风格描述
                        }

                        const res = await apiFetch("/api/v1/generate/", {
                            method: "POST",
                            body: JSON.stringify({
                                job_title: "用户指定岗位",
                                company: null,
                                job_description: text,
                                style_description: styleDescription   // 新增
                            })
                        });
                        const data = await res.json();
                        removeTyping();

                        if (data.pdf_url) {
                            addMessage("已根据你保存的所有信息，生成定制简历 PDF！\n点击下方按钮下载：", "bot");

                            // 添加下载按钮
<!--                            const container = document.getElementById("chat-container");-->
<!--                            const btnDiv = document.createElement("div");-->
<!--                            btnDiv.className = "message bot";-->
<!--                            btnDiv.innerHTML = `<a href="${data.pdf_url}"-->
<!--                                style="display:inline-block;padding:8px 16px;background:#2563eb;color:white;text-decoration:none;border-radius:6px;"-->
<!--                                target="_blank">下载 PDF 简历</a>`;-->
<!--                            container.appendChild(btnDiv);-->
<!--                            container.scrollTop = container.scrollHeight;-->
                                const downloadBtn = document.createElement("button");
                                downloadBtn.textContent = "下载 PDF 简历";
                                downloadBtn.className = "btn btn-primary";
                                downloadBtn.style.marginTop = "8px";
                                downloadBtn.onclick = async () => {
                                    const token = getToken();
                                    const res = await fetch(data.pdf_url, {
                                        headers: { "Authorization": `Bearer ${token}` }
                                    });
                                    const blob = await res.blob();
                                    const url = window.URL.createObjectURL(blob);
                                    const a = document.createElement("a");
                                    a.href = url;
                                    a.download = `简历_${Date.now()}.pdf`;
                                    a.click();
                                    window.URL.revokeObjectURL(url);
                                };

                                const btnWrapper = document.createElement("div");
                                btnWrapper.className = "message bot";
                                btnWrapper.appendChild(downloadBtn);
                                document.getElementById("chat-container").appendChild(btnWrapper);
                        } else {
                            addMessage("生成成功，但未返回文件链接", "bot");
                        }
                    } else {
                        // 普通信息 → 保存为补充内容
                        const res = await apiFetch("/api/v1/resumes/supplement", {
                            method: "POST",
                            body: JSON.stringify({ content: text })
                        });
                        const data = await res.json();
                        removeTyping();

                        if (res.ok) {
                            addMessage("已记录并保存这条信息。你可以继续补充，或随时发岗位JD让我生成简历。", "bot");
                        } else {
                            addMessage("保存失败：" + (data.detail || "未知错误"), "bot");
                        }
                    }
                }
            } catch (err) {
                removeTyping();
                addMessage("出错了：" + err.message, "bot");
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        // 回车发送（Shift+Enter 换行）
        document.getElementById("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            if (!checkAuth()) return;
            addMessage("你好，我是你的简历管家。\n\n你可以随时：\n1. 上传简历 PDF\n2. 告诉我项目经历、GitHub、技能等任何信息\n3. 直接粘贴岗位JD，说「帮我生成简历」\n\n所有信息都会自动保存，下次可以直接生成。", "bot");
        });
    </script>
</body>
</html>
