<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历管家 - Resume Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧聊天区 */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 14px 16px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        #message-input {
            flex: 1;
            min-height: 42px;
            max-height: 100px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .btn {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background: #cbd5e1; }
        .file-name { font-size: 12px; color: #64748b; margin-top: 6px; }

        /* 右侧生成区 */
        .generate-panel {
            width: 380px;
            background: white;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .generate-panel h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #475569;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .generate-btn {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .generate-btn:hover { background: #15803d; }
        .generate-btn:disabled { background: #86efac; cursor: not-allowed; }
        .gen-msg {
            margin-top: 12px;
            font-size: 13px;
            min-height: 18px;
        }
        .success { color: #16a34a; }
        .error { color: #dc2626; }

        @media (max-width: 860px) {
            .main { flex-direction: column; }
            .generate-panel { width: 100%; border-top: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>简历管家</h1>
        <div>
            <span style="font-size:13px;margin-right:12px;opacity:0.85;">已登录</span>
            <button onclick="logout()">退出</button>
        </div>
    </div>

    <div class="main">
        <!-- 左侧：对话区（随时补充信息） -->
        <div class="chat-panel">
            <div class="chat-container" id="chat-container"></div>

            <div class="input-area">
                <div class="input-row">
                    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="handleFileSelect(this)">
                    <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">上传文件</button>
                    <textarea id="message-input" placeholder="在这里补充项目经历、技能、GitHub、自我评价等任意信息..." rows="1"></textarea>
                    <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">发送</button>
                </div>
                <div class="file-name" id="file-name"></div>
            </div>
        </div>

        <!-- 右侧：专门生成简历 -->
        <div class="generate-panel">
            <h2>生成定制简历</h2>

            <div style="margin-bottom: 20px; padding: 12px; background: #f8fafc; border-radius: 8px;">
                <label style="font-size: 13px; font-weight: 500; color: #475569;">从网址添加项目经验</label>
                <input type="text" id="project-url" placeholder="输入 GitHub 仓库或网页地址"
                       style="width: 100%; padding: 8px 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
                <button class="btn btn-secondary" style="width: 100%;" onclick="analyzeUrlProject()">
                    分析并写入项目经验
                </button>
                <div id="url-project-msg" style="font-size: 12px; margin-top: 6px; min-height: 16px;"></div>
            </div>

            <button class="btn btn-secondary" style="width:100%; margin-bottom:18px;" onclick="runResumeCheck()">
                简历体检（检查冲突与优化点）
            </button>

            <div class="form-group">
                <label>职位名称</label>
                <input type="text" id="job-title" placeholder="例如：高级 Python 工程师">
            </div>

            <div class="form-group">
                <label>公司名称（可选）</label>
                <input type="text" id="company" placeholder="例如：字节跳动">
            </div>

            <div class="form-group">
                <label>岗位要求 / JD（必填）</label>
                <textarea id="job-description" placeholder="请粘贴完整的岗位描述..."></textarea>
            </div>

            <div class="form-group">
                <label>简历风格（可选）</label>
                <input type="text" id="style-description" placeholder="例如：极简黑白、现代双栏、商务正式...">
            </div>

            <button class="generate-btn" id="generate-btn" onclick="generateResume()">生成 PDF 简历</button>
            <div id="gen-msg" class="gen-msg"></div>
            <div id="download-area" style="margin-top:12px;"></div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function getToken() {
            return localStorage.getItem("token");
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        function checkAuth() {
            if (!getToken()) {
                window.location.href = "/login";
                return false;
            }
            return true;
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = { ...(options.headers || {}), "Authorization": `Bearer ${token}` };
            if (!(options.body instanceof FormData)) {
                headers["Content-Type"] = headers["Content-Type"] || "application/json";
            }
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                logout();
                throw new Error("登录已过期");
            }
            return res;
        }

        function addMessage(content, role = "bot") {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${role}`;
            div.textContent = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById("file-name").textContent = "已选择：" + selectedFile.name;
            }
        }

        // 发送补充信息（只负责保存，不触发生成）
        async function sendMessage() {
            if (!checkAuth()) return;

            const input = document.getElementById("message-input");
            const text = input.value.trim();
            const btn = document.getElementById("send-btn");

            if (!text && !selectedFile) return;

            if (selectedFile) {
                addMessage(`[上传文件] ${selectedFile.name}` + (text ? "\n" + text : ""), "user");
            } else {
                addMessage(text, "user");
            }

            input.value = "";
            btn.disabled = true;

            try {
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append("file", selectedFile);
                    if (text) formData.append("note", text);

                    const res = await apiFetch("/api/v1/resumes/upload", {
                        method: "POST",
                        body: formData
                    });
                    const data = await res.json();

                    if (res.ok) {
                        addMessage("已收到并解析你的文件，内容已保存。可以继续补充信息，或在右侧生成简历。", "bot");
                    } else {
                        addMessage("上传失败：" + (data.detail || "未知错误"), "bot");
                    }
                    selectedFile = null;
                    document.getElementById("file-name").textContent = "";
                    document.getElementById("file-input").value = "";
                } else {
                    // 普通文字 → 保存为补充信息
                    const res = await apiFetch("/api/v1/resumes/supplement", {
                        method: "POST",
                        body: JSON.stringify({ content: text })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        addMessage("已记录并保存。可以继续补充，或在右侧填写岗位要求后生成简历。", "bot");
                    } else {
                        addMessage("保存失败：" + (data.detail || "未知错误"), "bot");
                    }
                }
            } catch (err) {
                addMessage("出错了：" + err.message, "bot");
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        // 专门的生成简历函数
        async function generateResume() {
            if (!checkAuth()) return;

            const jobTitle = document.getElementById("job-title").value.trim();
            const company = document.getElementById("company").value.trim();
            const jobDescription = document.getElementById("job-description").value.trim();
            const styleDescription = document.getElementById("style-description").value.trim();
            const msgEl = document.getElementById("gen-msg");
            const downloadArea = document.getElementById("download-area");
            const btn = document.getElementById("generate-btn");

            if (!jobDescription) {
                msgEl.className = "gen-msg error";
                msgEl.innerText = "请填写岗位要求 / JD";
                return;
            }

            btn.disabled = true;
            msgEl.className = "gen-msg";
            msgEl.innerText = "正在生成简历，请稍候（大模型处理中）...";
            downloadArea.innerHTML = "";

            try {
                const res = await apiFetch("/api/v1/generate/", {
                    method: "POST",
                    body: JSON.stringify({
                        job_title: jobTitle || "目标岗位",
                        company: company || null,
                        job_description: jobDescription,
                        style_description: styleDescription || null
                    })
                });
                const data = await res.json();

                if (res.ok && data.pdf_url) {
                    msgEl.className = "gen-msg success";
                    msgEl.innerText = "生成成功！";

                    // 下载按钮（带 Token）
                    const downloadBtn = document.createElement("button");
                    downloadBtn.textContent = "下载 PDF 简历";
                    downloadBtn.className = "btn btn-primary";
                    downloadBtn.style.width = "100%";
                    downloadBtn.onclick = async () => {
                        const token = getToken();
                        const fileRes = await fetch(data.pdf_url, {
                            headers: { "Authorization": `Bearer ${token}` }
                        });
                        const blob = await fileRes.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `简历_${jobTitle || "resume"}.pdf`;
                        a.click();
                        window.URL.revokeObjectURL(url);
                    };
                    downloadArea.appendChild(downloadBtn);

                    addMessage(`已根据你保存的所有信息和右侧岗位要求，生成定制简历。请点击右侧下载按钮。`, "bot");
                } else {
                    msgEl.className = "gen-msg error";
                    msgEl.innerText = data.detail || data.message || "生成失败";
                }
            } catch (err) {
                msgEl.className = "gen-msg error";
                msgEl.innerText = err.message || "网络错误";
            } finally {
                btn.disabled = false;
            }
        }

        // 回车发送
        document.getElementById("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            if (!checkAuth()) return;
            addMessage("你好，我是你的简历管家。\n\n左侧可以随时上传简历或补充任何信息（都会自动保存）。\n右侧填写岗位要求后，点击「生成 PDF 简历」即可。", "bot");
        });

        // 简历体检
        async function runResumeCheck() {
            if (!checkAuth()) return;

            addMessage("正在对你已保存的所有内容进行体检，请稍候...", "bot");

            try {
                const res = await apiFetch("/api/v1/resumes/analyze", {
                    method: "POST"
                });
                const data = await res.json();

                if (!res.ok) {
                    addMessage("体检失败：" + (data.detail || "未知错误"), "bot");
                    return;
                }

                // 保存结果，供后续按钮使用
                lastAnalysisResult = {
                    summary: data.summary,
                    conflicts: data.conflicts || [],
                    optimizations: data.optimizations || [],
                    suggestions: data.suggestions || []
                };

                // 构建报告文本
                let msg = `【简历体检报告】\n\n${data.summary}\n\n`;

                if (data.conflicts && data.conflicts.length > 0) {
                    msg += "【发现的逻辑冲突】\n";
                    data.conflicts.forEach((item, i) => {
                        msg += `${i + 1}. ${item}\n`;
                    });
                    msg += "\n";
                } else {
                    msg += "【逻辑冲突】未发现明显冲突。\n\n";
                }

                if (data.optimizations && data.optimizations.length > 0) {
                    msg += "【可优化的地方】\n";
                    data.optimizations.forEach((item, i) => {
                        msg += `${i + 1}. ${item}\n`;
                    });
                    msg += "\n";
                }

                if (data.suggestions && data.suggestions.length > 0) {
                    msg += "【优化建议】\n";
                    data.suggestions.forEach((item, i) => {
                        msg += `${i + 1}. ${item}\n`;
                    });
                }

                // 渲染带按钮的消息
                addMessageWithButtons(msg, [
                    {
                        label: "按建议全部修改",
                        onClick: () => applyOptimization("按建议全部修改")
                    },
                    {
                        label: "只修复逻辑冲突",
                        onClick: () => applyOptimization("只修复逻辑冲突部分")
                    },
                    {
                        label: "只做表达优化",
                        onClick: () => applyOptimization("只做表达和量化优化，不改结构")
                    },
                    {
                        label: "暂不修改",
                        onClick: () => addMessage("好的，已取消修改。你仍可继续补充信息或生成简历。", "bot")
                    }
                ]);

            } catch (err) {
                addMessage("体检出错：" + err.message, "bot");
            }
        }

        // 添加带按钮的机器人消息
        function addMessageWithButtons(content, buttons = []) {
            const container = document.getElementById("chat-container");

            const wrapper = document.createElement("div");
            wrapper.className = "message bot";
            wrapper.style.maxWidth = "90%";

            // 文本内容
            const textDiv = document.createElement("div");
            textDiv.textContent = content;
            wrapper.appendChild(textDiv);

            // 按钮区域
            if (buttons.length > 0) {
                const btnContainer = document.createElement("div");
                btnContainer.style.marginTop = "12px";
                btnContainer.style.display = "flex";
                btnContainer.style.flexWrap = "wrap";
                btnContainer.style.gap = "8px";

                buttons.forEach(btn => {
                    const button = document.createElement("button");
                    button.textContent = btn.label;
                    button.className = "btn btn-primary";
                    button.style.fontSize = "13px";
                    button.style.padding = "7px 12px";
                    button.onclick = btn.onClick;
                    btnContainer.appendChild(button);
                });

                wrapper.appendChild(btnContainer);
            }

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        async function applyOptimization(instruction) {
            if (!checkAuth()) return;

            addMessage(`已选择：${instruction}\n正在优化并写回数据库，请稍候...`, "bot");

            try {
                const res = await apiFetch("/api/v1/resumes/apply-optimization", {
                    method: "POST",
                    body: JSON.stringify({
                        instruction: instruction,
                        previous_analysis: lastAnalysisResult
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    addMessage(data.message, "bot");

                    if (data.optimized_data && data.optimized_data.summary) {
                        addMessage("优化后的个人总结预览：\n" + data.optimized_data.summary, "bot");
                    }
                } else {
                    addMessage("优化失败：" + (data.detail || data.message || "未知错误"), "bot");
                }
            } catch (err) {
                addMessage("优化过程出错：" + err.message, "bot");
            }
        }

        async function analyzeUrlProject() {
            if (!checkAuth()) return;

            const urlInput = document.getElementById("project-url");
            const msgEl = document.getElementById("url-project-msg");
            const url = urlInput.value.trim();

            if (!url) {
                msgEl.style.color = "#dc2626";
                msgEl.innerText = "请输入网址";
                return;
            }

            msgEl.style.color = "#64748b";
            msgEl.innerText = "正在分析网址，请稍候...";

            try {
                const res = await apiFetch("/api/v1/projects/from-url", {
                    method: "POST",
                    body: JSON.stringify({ url })
                });
                const data = await res.json();

                if (res.ok) {
                    msgEl.style.color = "#16a34a";
                    msgEl.innerText = "添加成功！";
                    urlInput.value = "";

                    // 在对话框也提示一下
                    let tip = `已成功添加项目：${data.project.name}\n`;
                    if (data.project.highlights && data.project.highlights.length) {
                        tip += "亮点：\n" + data.project.highlights.map(h => "• " + h).join("\n");
                    }
                    addMessage(tip, "bot");
                } else {
                    msgEl.style.color = "#dc2626";
                    msgEl.innerText = data.detail || "分析失败";
                }
            } catch (err) {
                msgEl.style.color = "#dc2626";
                msgEl.innerText = err.message || "网络错误";
            }
        }
    </script>
</body>
</html>
